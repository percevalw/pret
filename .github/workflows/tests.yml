name: Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_call:
    inputs:
      run_non_test_jobs:
        description: "Run jobs other than the main test matrix"
        required: false
        type: boolean
        default: false

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  linting:
    name: 'Linting'
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: 'Compute git fetch depth'
        run: echo "PR_FETCH_DEPTH=$(( ${{ github.event.pull_request.commits }} + 1 ))" >> "${GITHUB_ENV}"

      # To support coverage diffing
      - name: 'Checkout PR branch and all PR commits'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: ${{ env.PR_FETCH_DEPTH }}
          submodules: 'recursive'

      - name: 'Setup Python'
        uses: actions/setup-python@v5

      - name: 'Run pre-commit'
        uses: pre-commit/action@v3.0.0
        with:
          extra_args: --color=always --from-ref ${{ github.event.pull_request.base.sha }} --to-ref ${{ github.event.pull_request.head.sha }}

  test:
    name: Python ${{ matrix.python }} JupyterLab ${{ matrix.jupyter }} ${{ matrix.browser }}
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]
        jupyter: ["3", "4"]
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - name: Install build dependencies
        run: uv pip install 'jupyterlab>=3.6,<4' hatchling editables hatch-jupyter-builder 'setuptools<82'
      - name: Install frontend dependencies
        run: npm install
      - name: Build and install
        run: uv pip install --no-build-isolation -e '.[testing]' --group dev
      - name: Install test runtime
        run: uv pip install 'jupyterlab>=${{ matrix.jupyter }},<${{ matrix.jupyter }}.99' 'ibis-framework[sqlite,pyspark]>=12,<13' 'pyspark>=3.5,<4'
      - name: Install browser
        run: npx playwright install --with-deps chromium ${{ matrix.browser }}
      - name: Run tests
        timeout-minutes: 30
        run: python -m pret.testing run --browser ${{ matrix.browser }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.python }}-jupyter${{ matrix.jupyter }}-${{ matrix.browser }}
          path: test-results/
          include-hidden-files: true
          retention-days: 14

  test-build:
    name: 'Test build wheel'
    if: ${{ github.event_name != 'workflow_call' || inputs.run_non_test_jobs }}
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 'Set up Node'
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 'Install build'
        run: pip install build

      - name: "Build wheel distribution"
        run: |
          python -m build --wheel

  docs:
    name: 'Test documentation'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 'Set up Node'
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: 'Install uv'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: 'Set up Git'
        run: |
          git config user.name ${{ github.actor }}
          git config user.email ${{ github.actor }}@users.noreply.github.com
          echo Current branch: $BRANCH_NAME
          # mike versions and Vercel projects cannot contain slashes, e.g. release/v0.7.0 becomes release-v0.7.0
          echo "BRANCH_NAME=${BRANCH_NAME//\//-}" >> "$GITHUB_ENV"

      - name: 'Install'
        run: |
          yarn install
          # install setuptools < 81 to fix issue with pkg_resources
          uv pip install -e . --group docs "setuptools<81"

      - name: 'Build docs'
        run: |
          mike deploy --alias-type=copy --update-aliases $BRANCH_NAME latest
          mike set-default $BRANCH_NAME

      - name: 'Put content of gh-pages to public folder'
        run: rm -rf public && mkdir public && git archive gh-pages | tar -x -C ./public/

      - name: 'Set up Vercel'
        run: npm install --global vercel@latest

      - name: 'Pull Vercel environment'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: 'Create new vercel project linked to this branch'
        run: vercel project add pret-$BRANCH_NAME --token=${{ secrets.VERCEL_TOKEN }}

      - name: 'Link public folder to the (maybe) new vercel project'
        run: vercel link --cwd public --project pret-$BRANCH_NAME --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: 'Deploy to Vercel'
        run: vercel deploy public/ --yes --token=${{ secrets.VERCEL_TOKEN }} --archive=tgz --prod > deployment-url.txt

      - name: 'Post the documentation link'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          slugify () {
              echo "$1" | iconv -c -t ascii//TRANSLIT | sed -E 's/[^a-zA-Z0-9-]+//g' | tr A-Z a-z
          }
          RAW_PROJECT_NAME="pret-$BRANCH_NAME"
          URL=https://$(slugify "$RAW_PROJECT_NAME").vercel.app/
          COMMENT_BODY="## Docs preview URL\n\n$URL\n\n"
          HEADER="Authorization: token $GITHUB_TOKEN"
          PR_COMMENTS_URL="https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"

          # Fetch existing comments to find if one from this workflow already exists
          COMMENTS=$(curl -s -H "$HEADER" "$PR_COMMENTS_URL")
          COMMENT_ID=$(echo "$COMMENTS" | jq -r '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("## Docs preview URL"))) | .id')

          # Check if we have a comment ID, if so, update it, otherwise create a new one
          if [[ "$COMMENT_ID" ]]; then
            # Update existing comment
            curl -s -X PATCH -H "$HEADER" -H "Content-Type: application/json" -d "{\"body\": \"$COMMENT_BODY\"}" "https://api.github.com/repos/${{ github.repository }}/issues/comments/$COMMENT_ID"
          else
            # Post new comment
            curl -s -X POST -H "$HEADER" -H "Content-Type: application/json" -d "{\"body\": \"$COMMENT_BODY\"}" "$PR_COMMENTS_URL"
          fi

          if [ $status -ne 0 ]; then
            exit $status
          fi
