[project]
name = "pret"
description = "Python framework to build reactive web apps with seamless server-client interaction"
authors = [
    { name = "Perceval Wajsburt", email = "perceval.wajsburt@gmail.com" }
]
readme = "README.md"
license = { file = "LICENSE" }
urls.homepage = "https://github.com/percevalw/pret/"
urls.repository = "https://github.com/percevalw/pret/"
dynamic = ["version"]
requires-python = ">=3.10,<4.0"
dependencies = [
    "ipykernel>=6,!=7.0.*,!=7.1.*,!=7.2.*,!=7.3.*",  # 7.0 to 7.3 can leave browser requests unread
    "quart",
    "typer",
    "pygetsource",
    "cbor2<5.8.0",  # 5.8 fails to decode Pret bundles
    "pyarrow>=14",
    "apsw>=3.50",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Widget Sets",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 3",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Mime Renderers",
]

# ----- CLI configuration -----
[project.scripts]
pret = "pret.cli:app"

# ----- Development configuration -----
[project.optional-dependencies]
legacy = ["pret-pycrdt>=0.12.44-post2"]
testing = ["pret[legacy]", "pytest>=8", "pytest-asyncio", "coverage>=7.10,<8", "pytest-cov>=7,<8", "tomli; python_version < '3.11'"]
coverage = ["pret[testing]"]
joy = [
    "pret-joy",
]

[dependency-groups]
dev = [
    "hatchling",
    "hatch-jupyter-builder",
    "pret-joy",
    "pytest-asyncio",
    "transcrypt",
]
docs = [
    "mkdocs-eds @ git+https://github.com/percevalw/mkdocs-eds.git@main; python_version >= '3.9'",
    "pret-joy",
    "metanno",
    "pandas",
]
unreleased-deps = [
    "metanno @ git+https://github.com/percevalw/metanno.git@main",
]

# ----- Linting & Testing -----
[tool.ruff]
fix = true
exclude = [
    ".git",
    "__pycache__",
    "__init__.py",
    ".mypy_cache",
    ".pytest_cache",
    ".venv",
    "build",
    "pret/react.py"
]
line-length = 120
lint.select = [
    "E",
    "F",
    "W",
    "I001"
]
lint.fixable = ["E", "F", "W", "I"]

[tool.ruff.lint.extend-per-file-ignores]
# Also ignore `E402` in all `__init__.py` files.
"__init__.py" = ["E402", "F401"]
"docs/tutorials/*.ipynb" = ["F811", "F821", "E501"]


# ----- Build configuration -----
[tool.hatch.version]
path = "pret/__init__.py"

[build-system]
requires = ["hatchling", "jupyterlab<4.0.0", "pip<=24.0", "hatch-jupyter-builder", "virtualenv<21.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder"]
build-function = "hatch_jupyter_builder.npm_builder"
# The weakref runtime comes from the vendor/transcrypt submodule, missing until `git submodule update --init`
ensured-targets = ["pret/js-extension/package.json", "vendor/transcrypt/transcrypt/modules/weakref/__init__.js"]
install-pre-commit-hook = true
optional-editable-build = false
build-kwargs = { "build_cmd" = "build", "npm" = ["npm"] }
editable-build-kwargs = { "build_cmd" = "build:dev", "npm" = ["npm"] }

[tool.hatch.build]
artifacts = [
    "vendor/transcrypt/transcrypt/modules",
]

[tool.hatch.build.targets.wheel]
packages = [
    "pret",
    "vendor/transcrypt/transcrypt",
]
artifacts = [
    "pret",
    "vendor/transcrypt/transcrypt/modules",
]

[tool.hatch.build.targets.wheel.shared-data]
"pret/js-extension" = "share/jupyter/labextensions/pret"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
transcrypt = { path = "./vendor/transcrypt", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.pret.testing]
python = ["tests/python"]
